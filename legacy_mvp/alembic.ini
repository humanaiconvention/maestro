# Alembic Configuration — Maestro Legacy MVP
# Generated by: Maestro Governance Bridge (Part C)
#
# Usage:
#   cd legacy_mvp
#   alembic upgrade head          # apply all migrations
#   alembic revision --autogenerate -m "describe change"  # generate new migration
#   alembic downgrade -1          # roll back one migration

[alembic]
script_location = alembic
prepend_sys_path = .

# DATABASE_URL takes precedence; falls back to SQLite for local dev
sqlalchemy.url = sqlite:///./maestro.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
