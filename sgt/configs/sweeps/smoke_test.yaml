# Smoke test configuration
experiment_name: "smoke_test"
models:
  - "Qwen/Qwen2.5-0.5B"

recursion:
  max_generations: 1
  synthetic_samples_per_generation: 50
  data_policy: "replace"
  generation_temperature: 0.7

training:
  batch_size: 2
  learning_rate: 2e-4
  epochs_per_generation: 1
  use_lora: true
  lora_r: 4

datasets:
  train_family: "synthetic"
  eval_samples: 10

sweeps:
  seeds: [42]
  correction_fractions: [0.0]

output_dir: "results/sweeps/smoke_test"
