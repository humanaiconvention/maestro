# Master configuration for testing the temporal signature and viability thresholds

experiment_name: "temporal_falsification_sweep"
models:
  - "Qwen/Qwen2.5-0.5B"
  # - "EleutherAI/pythia-70m" # Uncomment for fast small-scale baseline

recursion:
  max_generations: 5
  synthetic_samples_per_generation: 500
  data_policy: "replace" # Options: "replace", "accumulate"
  generation_temperature: 0.7

training:
  batch_size: 4
  learning_rate: 2e-4
  epochs_per_generation: 3
  use_lora: true
  lora_r: 8

datasets:
  train_family: "synthetic" # Seed data for G0
  eval_samples: 100

sweeps:
  seeds: [42, 123, 999] # Add more (e.g., 5 total) for full paper-grade run
  correction_fractions: [0.0, 0.1, 0.3, 0.5, 0.8]

# Logging and IO
output_dir: "results/sweeps/temporal_falsification"
